name: Code checks
on:
  pull_request:
    branches: [ "main" ]
jobs:
  scalafmt-lint:
    name: Scalafmt lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: jrouly/scalafmt-native-action@v5

  scalafix-lint:
    name: Scalafix lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - run: sbt 'scalafixAll --check'
