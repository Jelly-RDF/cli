name: Compile & publish
on:
  push:
    branches: [ "main" ]
    tags: ["v*"]

jobs:
  aot-compile:
    name: AOT compile on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04, ubuntu-22.04-arm]
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Build native image
        run: sbt GraalVMNativeImage/packageBin

      - name: Collect the binary
        shell: bash
        run: |
          set -euo pipefail

          mkdir binary
          # sbt 2 nests build outputs under target/out/<platform>/<scala version>/<project>/
          mv target/out/jvm/scala-*/jelly-cli/graalvm-native-image/* binary/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: jelly-cli-${{ matrix.os }}
          path: binary/*

  jit-compile:
    name: Build the uber-JAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt

      - name: Setup SBT
        uses: sbt/setup-sbt@v1

      - name: Build assembly
        shell: bash
        run: |
          sbt -v assembly
          mv target/out/jvm/scala-*/jelly-cli/jelly-cli-assembly*.jar jelly-cli.jar

      - name: Upload assembly
        uses: actions/upload-artifact@v7
        with:
          name: jelly-cli-assembly
          path: jelly-cli.jar

  publish:
    runs-on: ubuntu-latest
    needs:
      - aot-compile
      - jit-compile
    steps:
      - uses: actions/download-artifact@v8

      - name: Rename binaries
        run: |
          mv jelly-cli-assembly/jelly-cli.jar jelly-cli.jar
          mv jelly-cli-macos-14/jelly-cli jelly-cli-mac-arm64
          mv jelly-cli-ubuntu-22.04/jelly-cli jelly-cli-linux-x86_64
          mv jelly-cli-ubuntu-22.04-arm/jelly-cli jelly-cli-linux-arm64
          mv jelly-cli-windows-2022/jelly-cli.exe jelly-cli-windows-x86_64.exe

      - name: Create gzipped versions
        run: |
          gzip -9 -k jelly-cli-mac-arm64 &
          gzip -9 -k jelly-cli-linux-x86_64 &
          gzip -9 -k jelly-cli-linux-arm64 &
          gzip -9 -k jelly-cli-windows-x86_64.exe &
          wait

      - name: Upload binaries (pre-release)
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1.21.0
        with:
          allowUpdates: true
          prerelease: true
          draft: false
          omitDraftDuringUpdate: false
          makeLatest: false
          tag: dev
          name: "Development build"
          artifacts: jelly-cli*
          generateReleaseNotes: true

      - name: Upload binaries (tagged release)
        if: github.ref != 'refs/heads/main'
        uses: ncipollo/release-action@v1.21.0
        with:
          prerelease: false
          draft: false
          makeLatest: true
          tag: "${{ github.ref_name }}"
          name: "${{ github.ref_name }}"
          artifacts: jelly-cli*
          generateReleaseNotes: true
